  </g>
  <g id="father_name_2">
    <text transform="translate(180 379.6)" fill="#7a4c1a" font-family="Heebo" font-size="9.9" font-weight="700" text-anchor="middle"><tspan x="0" y="0">חתן בערל גרינפעלד הי״ו</tspan></text>
  </g>
