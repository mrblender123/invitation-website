<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 504">
    <g id="text13">
    <text transform="translate(180 116.1)" text-anchor="middle" font-family="Heebo" font-size="8" font-weight="400"><tspan x="0" y="0">בעזרת השם יתברך</tspan></text>
  </g>
    <g id="text12">
    <text transform="translate(180 128.9)" text-anchor="middle" font-family="Heebo" font-size="8" font-weight="400"><tspan x="0" y="0" xml:space="preserve">קול ששון  -  וקול שמחה  -  קול חתן  -  וקול כלה</tspan></text>
  </g>
    <g id="text11">
    <text transform="translate(180 147.3)" text-anchor="middle" font-family="Heebo" font-size="9" font-weight="400"><tspan x="0" y="0">ברוב שבח והודאה להשי״ת</tspan></text>
  </g>
    <g id="text10">
    <text transform="translate(180 158)" text-anchor="middle" font-family="Heebo" font-size="8" font-weight="400"><tspan x="0" y="0">הננו מתכבדים להזמין את כבודינו</tspan></text>
  </g>
    <g id="text9">
    <text transform="translate(180 170.7)" text-anchor="middle" font-family="Heebo" font-size="8" font-weight="400"><tspan x="0" y="0">להשתתף בשמחת כלולות בנינו היקרים</tspan></text>
  </g>
    <g id="text8">
    <text transform="translate(180 189.5)" text-anchor="middle" font-family="Heebo" font-size="4.9" font-weight="400"><tspan x="0" y="0">החתן</tspan></text>
  </g>
    <g id="text7">
    <text transform="translate(180 222.5)" text-anchor="middle" font-family="Heebo" font-size="4.9" font-weight="400"><tspan x="0" y="0">נ״י</tspan></text>
  </g>
  <g id="groom_name*">
