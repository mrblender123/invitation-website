  </g>
    <g id="text6">
    <text transform="translate(180 235.7)" text-anchor="middle" font-family="Heebo" font-size="4.9" font-weight="400"><tspan x="0" y="0">עב״ג</tspan></text>
  </g>
    <g id="text5">
    <text transform="translate(180 251.6)" text-anchor="middle" font-family="Heebo" font-size="4.9" font-weight="400"><tspan x="0" y="0">הכלה</tspan></text>
  </g>
  <g id="bride_name*">
    <text transform="translate(180 275.1)" text-anchor="middle" fill="#80715a" font-family="Heebo" font-size="29.1" font-weight="700"><tspan x="0" y="0">שרה</tspan></text>
  </g>
    <g id="text4">
    <text transform="translate(180 283.3)" text-anchor="middle" font-family="Heebo" font-size="4.9" font-weight="400"><tspan x="0" y="0">תחי׳</tspan></text>
  </g>
    <g id="text3">
