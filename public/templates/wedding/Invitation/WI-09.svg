  </g>
  <g id="day*">
    <text transform="translate(180 308.8)" text-anchor="middle" font-family="Heebo" font-size="8" font-weight="400"><tspan x="0" y="0">ביום רביעי לפרשת יתרו</tspan></text>
  </g>
  <g id="date*">
    <text transform="translate(180 319.1)" text-anchor="middle" font-family="Heebo" font-size="8" font-weight="400"><tspan x="0" y="0">אור לי״ז שבט תשפ״ו לפ״ק</tspan></text>
  </g>
  <g id="reception_time*">
    <text transform="translate(180 338.2)" text-anchor="middle" font-family="Heebo" font-size="8" font-weight="400"><tspan x="0" y="0">קבלת פנים בשעה</tspan></text>
  </g>
  <g id="chupa_time*">
