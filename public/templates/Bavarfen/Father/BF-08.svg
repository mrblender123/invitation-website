<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 504">
  <text transform="translate(180 131.2)" fill="#1a1a1b" font-family="Heebo" font-size="9.1" font-weight="700" text-anchor="middle"><tspan x="0" y="0">ברוב שבח והודאה להשי״ת</tspan></text>
  <text transform="translate(180 141.1)" fill="#1a1a1b" font-family="Heebo" font-size="9.1" font-weight="700" text-anchor="middle"><tspan x="0" y="0">הננו מתכבדים להזמין את כבוד ידידנו</tspan></text>
  <text transform="translate(180 149.3)" fill="#1a1a1b" font-family="Heebo" font-size="9.1" font-weight="700" text-anchor="middle"><tspan x="0" y="0">להשתתף עמנו בשמחת</tspan></text>
  <text transform="translate(180 216.1)" fill="#1a1a1b" font-family="Heebo" font-size="10.6" font-weight="700" text-anchor="middle"><tspan x="0" y="0">של בני החתן בנימין זאב נ״י</tspan></text>
  <text transform="translate(180 239.8)" fill="#1a1a1b" font-family="Heebo" font-size="9.1" font-weight="700" text-anchor="middle"><tspan x="0" y="0">שתתקיים אי״ה</tspan></text>
  <g id="day*">
    <text transform="translate(180 258.7)" fill="#1a1a1b" font-family="Heebo" font-size="17.7" font-weight="700" text-anchor="middle"><tspan x="0" y="0">ביום שבת קודש</tspan></text>
  </g>
  <g id="parasha*">
    <text transform="translate(180 275)" fill="#1a1a1b" font-family="Heebo" font-size="14.2" font-weight="700" text-anchor="middle"><tspan x="0" y="0">פרשת ויגש</tspan></text>
  </g>
  <g id="location*">
    <text transform="translate(180 300.4)" fill="#1a1a1b" font-family="Heebo" font-size="12.6" font-weight="700" text-anchor="middle"><tspan x="0" y="0">בביהמ״ד קהל חסידי בעלזא</tspan></text>
  </g>
  <g id="street*">
    <text transform="translate(180 312.8)" fill="#1a1a1b" font-family="Heebo" font-size="12.6" font-weight="700" text-anchor="middle"><tspan x="0" y="0">1247 38th St</tspan></text>
  </g>
  <g id="greeting*">
    <text transform="translate(180 352.3)" fill="#1a1a1b" font-family="Heebo" font-size="9.8" font-weight="700" text-anchor="middle"><tspan x="0" y="0">ידידכם המצפה לקבל פניכם</tspan></text>
  </g>
  <g id="time">
    <text transform="translate(180 329.8)" fill="#1a1a1b" font-family="Heebo" font-size="12.6" font-weight="700" text-anchor="middle"><tspan x="0" y="0">שחרית</tspan></text>
  </g>
  <g id="host_name*">
