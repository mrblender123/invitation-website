  </g>
  <g id="line_90">
    <text transform="translate(180 316.8)" text-anchor="middle" fill="#bdb6ae" font-family="Heebo" font-size="12.8" font-weight="600"><tspan x="0" y="0">בשעה 10:00</tspan></text>
  </g>
